# ================================================================================
# GITHUB ACTIONS - macOS TEST MATRIX
# ================================================================================
# PROJECT: dpx_tr_again
# Purpose: Build + install the app on real macOS runners (Intel and Apple
#          Silicon) and prove the launcher picks the highest version and opens
#          multiple instances. Uses FAKE "Tessera Remote" apps, never the real one.
# ================================================================================
name: Test on macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]   # macos-13 (Intel) runners sit queued indefinitely
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers; uname -m
          printf 'sort -V check: '; printf '3.5.2\n3.10.0\n' | sort -V | tail -1

      - name: Syntax check
        run: |
          sh -n install.sh
          sh -n build.sh
          sh -n src/TesseraRemoteAgain

      - name: Build (app, zip, dmg)
        run: ./build.sh

      - name: install.sh creates a valid app
        run: |
          D="$RUNNER_TEMP/inst"
          sh install.sh "$D"
          A="$D/TesseraRemoteAgain.app"
          plutil -lint "$A/Contents/Info.plist"
          test -x "$A/Contents/MacOS/TesseraRemoteAgain"
          test -f "$A/Contents/Resources/AppIcon.icns"
          if xattr -lr "$A" | grep -q com.apple.quarantine; then echo "unexpected quarantine"; exit 1; fi

      - name: Create fake Tessera Remote apps (3.5.2 and 3.10.0)
        run: |
          mkdir -p "$HOME/Applications"
          for v in 3.5.2 3.10.0; do
            A="$HOME/Applications/Tessera Remote $v.app"
            mkdir -p "$A/Contents/MacOS"
            cat > "$A/Contents/MacOS/fake" <<'FAKE'
          #!/bin/sh
          # Record which app bundle was launched, then stay alive so instances overlap.
          B=$(dirname "$(dirname "$(dirname "$0")")")
          echo "${B##*/}" >> /tmp/tessera-launches.log
          sleep 30
          FAKE
            chmod +x "$A/Contents/MacOS/fake"
            cat > "$A/Contents/Info.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>fake</string>
            <key>CFBundleIdentifier</key><string>test.fake.tessera</string>
            <key>CFBundleName</key><string>Tessera Remote</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          PL
          done
          rm -f /tmp/tessera-launches.log

      - name: Launcher opens the HIGHEST version, twice (multiple instances)
        run: |
          L="$RUNNER_TEMP/inst/TesseraRemoteAgain.app/Contents/MacOS/TesseraRemoteAgain"
          "$L"; "$L"
          # wait up to 30s for both fake instances to report in
          for i in $(seq 1 30); do
            [ "$(wc -l < /tmp/tessera-launches.log 2>/dev/null || echo 0)" -ge 2 ] && break
            sleep 1
          done
          echo "--- launches:"; cat /tmp/tessera-launches.log
          test "$(wc -l < /tmp/tessera-launches.log)" -ge 2
          test "$(sort -u /tmp/tessera-launches.log)" = "Tessera Remote 3.10.0.app"
          echo "--- running instances:"; pgrep -fl "Tessera Remote 3.10.0.app/Contents/MacOS/fake" || true
          test "$(pgrep -f 'Tessera Remote 3.10.0.app/Contents/MacOS/fake' | wc -l)" -ge 2
          pkill -f 'Contents/MacOS/fake' || true

      - name: Not-found path shows an alert (osascript stubbed)
        run: |
          SHIM="$RUNNER_TEMP/shim"; mkdir -p "$SHIM" "$RUNNER_TEMP/emptyhome"
          printf '#!/bin/sh\necho "ALERT: $*" > "%s/alert.log"\n' "$RUNNER_TEMP" > "$SHIM/osascript"
          chmod +x "$SHIM/osascript"
          # move the fakes away so nothing matches
          mv "$HOME/Applications" "$RUNNER_TEMP/apps-away"
          set +e
          PATH="$SHIM:$PATH" "$RUNNER_TEMP/inst/TesseraRemoteAgain.app/Contents/MacOS/TesseraRemoteAgain"
          rc=$?
          set -e
          mv "$RUNNER_TEMP/apps-away" "$HOME/Applications"
          cat "$RUNNER_TEMP/alert.log"
          test "$rc" -ne 0
          grep -q "not found" "$RUNNER_TEMP/alert.log"

      - name: DMG contents and Gatekeeper behaviour (informational)
        run: |
          M="$RUNNER_TEMP/mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$M" dist/*.dmg
          ls -la "$M"
          test -x "$M/TesseraRemoteAgain.app/Contents/MacOS/TesseraRemoteAgain"
          test -L "$M/Applications"
          ditto "$M/TesseraRemoteAgain.app" "$RUNNER_TEMP/fromdmg.app"
          hdiutil detach -quiet "$M"
          # simulate a browser download: add the quarantine flag, ask Gatekeeper
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$RUNNER_TEMP/fromdmg.app"
          spctl --assess --type execute -vv "$RUNNER_TEMP/fromdmg.app" || echo "(expected) Gatekeeper rejects the unsigned, quarantined app"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.dmg

  # Real-app smoke test: download Brompton's official Tessera Remote 3.5.2 DMG
  # (not redistributed; fetched fresh/cached per run), install it, and prove the
  # launcher opens two simultaneous instances of the REAL app.
  real-tessera:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]   # Intel = native; arm64 = via Rosetta (app is x86_64 only)
    runs-on: ${{ matrix.os }}
    env:
      TESSERA_DMG_URL: https://dl.bromptontech.com/tessera/management_app/Tessera_Remote_v3.5.2_installer.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: sw_vers; uname -m

      - name: Rosetta (Apple Silicon only; the app is x86_64)
        if: runner.arch == 'ARM64'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Cache Tessera Remote DMG
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/tessera.dmg
          key: tessera-remote-3.5.2-dmg

      - name: Download Tessera Remote DMG
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 -o ~/tessera.dmg "$TESSERA_DMG_URL"

      - name: Install the real app into ~/Applications
        run: |
          M="$RUNNER_TEMP/tmnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$M" ~/tessera.dmg
          mkdir -p "$HOME/Applications"
          ditto "$M/Tessera Remote 3.5.2.app" "$HOME/Applications/Tessera Remote 3.5.2.app"
          hdiutil detach -quiet "$M"
          ls -d "$HOME/Applications/"Tessera*

      - name: Install the launcher
        run: sh install.sh "$RUNNER_TEMP/inst"

      - name: Launcher opens two simultaneous instances of the REAL app
        run: |
          L="$RUNNER_TEMP/inst/TesseraRemoteAgain.app/Contents/MacOS/TesseraRemoteAgain"
          "$L"; sleep 2; "$L"
          for i in $(seq 1 30); do
            n=$(pgrep -f 'Tessera Remote 3.5.2.app/Contents/MacOS/tessera_remote' | wc -l | tr -d ' ')
            [ "$n" -ge 2 ] && break
            sleep 1
          done
          echo "--- running instances: $n"
          pgrep -fl 'tessera_remote' || true
          # leave them running a few seconds to catch immediate crashes
          sleep 5
          n=$(pgrep -f 'Tessera Remote 3.5.2.app/Contents/MacOS/tessera_remote' | wc -l | tr -d ' ')
          echo "--- still running after 5s: $n"
          test "$n" -ge 2
          pkill -f 'tessera_remote' || true
